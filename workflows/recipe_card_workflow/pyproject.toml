[project]
name = "recipe-card-workflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "gemini-shared",
  "recipe-cards",
  "google-adk[extensions]==2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_card_workflow"]
