[project]
name = "bigquery-mcp-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "gemini-shared",
  "google-adk[extensions,mcp]==2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bigquery_mcp_agent"]
