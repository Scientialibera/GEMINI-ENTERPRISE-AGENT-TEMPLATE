[project]
name = "gemini-enterprise-agent-template"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "agents/*",
  "packages/*",
]

[tool.uv.sources]
gemini-shared = { workspace = true }

[dependency-groups]
dev = [
  "google-cloud-aiplatform[agent_engines,adk]==1.164.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
]
