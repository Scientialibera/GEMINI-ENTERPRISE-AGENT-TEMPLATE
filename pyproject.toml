[project]
name = "gemini-enterprise-agent-template"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "agents/*",
  "packages/*",
]

[tool.uv.sources]
gemini-shared = { workspace = true }

[dependency-groups]
dev = [
  "google-cloud-aiplatform[agent_engines,adk]==1.164.0",
  "google-cloud-bigquery==3.43.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"dev/bootstrap.py" = ["S603"]
