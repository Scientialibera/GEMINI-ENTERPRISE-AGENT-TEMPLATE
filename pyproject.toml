[project]
name = "gemini-enterprise-agent-template"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "agents/*",
  "workflows/*",
  "packages/*",
]

[tool.uv.sources]
gemini-shared = { workspace = true }
recipe-cards = { workspace = true }

[dependency-groups]
dev = [
  "gemini-shared",
  "recipe-cards",
  "google-cloud-bigquery==3.43.0",
  "google-cloud-secret-manager>=2.20.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "pytest>=9.0.3,<10.0.0",
  "requests>=2.32.0,<3.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Import workspace packages from source, so tests run without an editable install.
# Add a line here when adding an agent.
pythonpath = [
  "dev",
  "packages/gemini_shared/src",
  "packages/recipe_cards/src",
  "agents/basic_assistant/src",
  "agents/auth_reference_agent/src",
  "agents/bigquery_mcp_agent/src",
  "agents/monitoring_mcp_agent/src",
  "agents/recipe_card_agent/src",
  "workflows/recipe_card_workflow/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"dev/gcp.py" = ["S603"]
"dev/deploy/dependencies.py" = ["S603"]
# S105 flags the environment variable name that holds the OAuth client secret
# and the public Google token endpoint. Neither is a credential value.
"dev/register/register_agent.py" = ["S105", "E402"]
# E402: these scripts run directly as well as being imported, so they put dev/
# on sys.path before importing anything from it.
"dev/deploy/*.py" = ["E402"]
"dev/config/bootstrap_dev.py" = ["E402"]
"dev/iam/*.py" = ["E402"]
# The card renderer degrades a missing or unreadable image to a placeholder
# rather than losing the whole deck, so these handlers are deliberately silent.
# E501 covers the layout tables, which stay readable as single lines.
"packages/recipe_cards/src/recipe_cards/rendering/*.py" = [
  "E501",
  "S110",
  "S112",
  "SIM105",
]
