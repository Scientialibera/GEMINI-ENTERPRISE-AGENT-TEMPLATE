[project]
name = "gemini-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "google-adk[extensions]==2.7.1",
  "google-cloud-parametermanager==0.4.1",
  "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_shared"]
